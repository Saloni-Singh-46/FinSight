version: "3.8"

services:
  finsight-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsight_api
    command: uvicorn finsight.api.server:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    volumes:
      - finsight-data:/app/data
      - finsight-runs:/app/runs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  finsight-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsight_ui
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    env_file:
      - .env
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_HOST: finsight-api
      API_PORT: "8000"
    depends_on:
      finsight-api:
        condition: service_healthy
    volumes:
      - finsight-data:/app/data
      - finsight-runs:/app/runs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  default:
    name: finsight_network

volumes:
  finsight-data:
  finsight-runs:
